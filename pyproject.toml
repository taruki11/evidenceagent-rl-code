[build-system]
# setuptools>=77 is required for the SPDX ``license`` string and
# ``license-files`` below. Older releases reject that metadata outright.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-agent-rl"
version = "0.1.0"
description = "Replayable harness for evidence-grounded search-agent reinforcement learning"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["evidence-grounding", "reinforcement-learning", "agents", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/taruki11/evidenceagent-rl-code"
Issues = "https://github.com/taruki11/evidenceagent-rl-code/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

